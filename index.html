<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASİRPLAST | Profesyonel Toptan Hasır</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000; color: #fff; scroll-behavior: smooth; }
        .admin-gizli { display: none !important; }
        .dark-glass { background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(20px); border-left: 1px solid rgba(255, 255, 255, 0.05); }
        .hero-gradient { background: radial-gradient(circle at center, #064e3b 0%, #000 100%); }
        input, textarea { background: #111 !important; border: 1px solid #222 !important; color: white !important; }
        .product-card { background: #0a0a0a; border: 1px solid #1a1a1a; transition: all 0.4s ease; }
        .product-card:hover { border-color: #10b981; transform: translateY(-5px); }
    </style>
</head>
<body>

    <section id="welcomeScreen" class="fixed inset-0 z-[500] hero-gradient flex flex-col items-center justify-center text-center px-6">
        <div class="mb-8 animate-bounce">
            <i class="fa-solid fa-rug text-emerald-500 text-6xl"></i>
        </div>
        <h1 class="text-6xl md:text-8xl font-black italic uppercase tracking-tighter mb-4">HASİR<span class="text-emerald-500">PLAST</span></h1>
        <p class="text-zinc-400 font-bold uppercase tracking-[0.4em] mb-12 text-xs md:text-sm italic">Antibakteriyel Plastik Hasırda Öncü Marka</p>
        <button onclick="enterSite()" class="bg-white text-black px-12 py-5 rounded-2xl font-black uppercase tracking-widest text-xs hover:bg-emerald-500 hover:text-white transition-all active:scale-95 shadow-2xl shadow-emerald-500/20">
            Ürünleri Gör <i class="fa-solid fa-arrow-right ml-2"></i>
        </button>
    </section>

    <div id="adminPanel" class="fixed inset-y-0 left-0 w-[350px] dark-glass p-8 z-[600] overflow-y-auto admin-gizli border-r border-emerald-500/20 shadow-2xl">
        <div class="flex justify-between items-center mb-8">
            <h3 class="text-emerald-500 font-black uppercase text-xs tracking-widest italic">Ürün & İçerik Yönetimi</h3>
            <button onclick="togglePanel()" class="text-2xl text-zinc-500">&times;</button>
        </div>
        <div id="productEditorFields" class="space-y-10"></div>
        <button onclick="localStorage.clear(); location.reload();" class="w-full mt-12 py-4 bg-red-900/10 text-red-500 rounded-xl text-[10px] font-bold border border-red-900/20 uppercase tracking-widest">Sistemi Sıfırla</button>
    </div>

    <div id="sepetOverlay" onclick="toggleSepet()" class="fixed inset-0 bg-black/90 z-[210] hidden backdrop-blur-md"></div>
    <div id="sepetSidebar" class="fixed inset-y-0 right-0 w-full md:w-[450px] dark-glass z-[220] translate-x-full transition-transform duration-500 flex flex-col">
        <div class="p-10 border-b border-white/5 flex justify-between items-center">
            <h3 class="text-2xl font-black italic uppercase tracking-tighter text-white">Sipariş Listem</h3>
            <button onclick="toggleSepet()" class="text-4xl font-light">&times;</button>
        </div>
        <div id="sepetListesi" class="flex-1 overflow-y-auto p-8 space-y-6"></div>
        <div class="p-10 bg-zinc-900/50">
            <div class="flex justify-between items-end mb-8">
                <div class="flex flex-col">
                    <span class="text-zinc-500 font-bold uppercase text-[10px] tracking-widest italic">Genel Toplam</span>
                    <span id="sepetToplam" class="text-4xl font-black text-emerald-500 italic">₺0,00</span>
                </div>
            </div>
            <button onclick="whatsappSepetGonder()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-6 rounded-2xl font-black uppercase tracking-widest text-xs transition-all active:scale-95">Siparişi Onayla</button>
        </div>
    </div>

    <main id="mainContent" class="opacity-0 transition-opacity duration-1000">
        <nav class="fixed top-0 inset-x-0 z-[150] px-8 py-6 flex justify-between items-center bg-black/80 backdrop-blur-md border-b border-white/5">
            <div class="font-black italic text-2xl tracking-tighter">HASİR<span class="text-emerald-500">PLAST</span></div>
            <button onclick="toggleSepet()" class="bg-white/5 p-4 rounded-2xl relative border border-white/5 hover:bg-emerald-500/10 transition-all">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="sepetAdet" class="absolute -top-1 -right-1 bg-emerald-500 text-black text-[10px] font-black w-6 h-6 rounded-full flex items-center justify-center border-2 border-black">0</span>
            </button>
        </nav>

        <section id="katalog" class="pt-40 pb-32 px-8">
            <div class="container mx-auto">
                <div class="mb-16">
                    <h2 class="text-4xl font-black italic uppercase tracking-tighter">Tüm Koleksiyon</h2>
                    <p class="text-zinc-500 text-xs font-bold uppercase tracking-[0.3em] mt-2 italic">Toptan Satışlarda 25'li Bağ Baz Alınır</p>
                </div>
                <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-10"></div>
            </div>
        </section>
    </main>

    <script>
        const NO = "905336586270";
        let sepet = JSON.parse(localStorage.getItem('hasir_sepet_v16')) || [];
        
        // SİTEYE GİRİŞ FONKSİYONU
        function enterSite() {
            document.getElementById('welcomeScreen').style.transform = 'translateY(-100%)';
            document.getElementById('welcomeScreen').style.transition = 'transform 1s cubic-bezier(0.85, 0, 0.15, 1)';
            document.getElementById('mainContent').style.opacity = '1';
        }

        // CTRL + P PANEL KONTROLÜ
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'p') {
                e.preventDefault();
                let sifre = prompt("Yönetici Şifresi:");
                if(sifre === "nmkhasir") togglePanel();
            }
        });

        function togglePanel() { document.getElementById('adminPanel').classList.toggle('admin-gizli'); }

        // ÜRÜNLERİ OLUŞTUR
        for(let i=1; i<=8; i++) {
            document.getElementById('productGrid').innerHTML += `
                <div class="product-card rounded-[3rem] overflow-hidden p-8 flex flex-col">
                    <div class="relative mb-8 aspect-square rounded-[2rem] overflow-hidden bg-zinc-900">
                        <img id="prodImg${i}" src="antrasit.jpeg" class="w-full h-full object-cover opacity-80">
                        <div class="absolute top-4 left-4">
                            <span class="bg-emerald-500 text-black text-[8px] font-black px-3 py-1.5 rounded-full uppercase italic">25 Bağ</span>
                        </div>
                    </div>
                    <h3 id="prodName${i}" class="font-black text-xl uppercase italic mb-3 text-white tracking-tighter leading-tight">Ürün ${i}</h3>
                    <p id="prodDescDisplay${i}" class="text-zinc-500 text-xs italic mb-6 line-clamp-2">Ürün açıklaması burada yer alacak.</p>
                    <div class="mt-auto flex items-center justify-between">
                        <div class="flex flex-col">
                            <span class="text-emerald-500 font-black text-2xl italic tracking-tight">₺<span id="prodPriceDisplay${i}">400,00</span></span>
                            <span class="text-[8px] font-bold text-zinc-600 uppercase italic">Bağ Fiyatı</span>
                        </div>
                        <button onclick="addToCart(${i})" class="bg-white text-black p-4 rounded-2xl hover:bg-emerald-500 hover:text-white transition-all active:scale-90">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>`;
            
            document.getElementById('productEditorFields').innerHTML += `
                <div class="bg-white/5 p-6 rounded-3xl border border-white/5 space-y-4">
                    <span class="text-emerald-500 font-black text-[10px] tracking-widest uppercase">Ürün #${i}</span>
                    <input type="file" onchange="handleFile(${i}, this)" class="w-full text-[10px] file:bg-emerald-600 file:border-0 file:rounded-lg file:px-4 file:py-2 file:text-white file:font-black">
                    <input type="text" id="inputName${i}" oninput="update(${i})" class="w-full p-4 rounded-xl text-[10px]" placeholder="Ürün Adı">
                    <input type="number" id="inputPrice${i}" oninput="update(${i})" class="w-full p-4 rounded-xl text-[10px]" placeholder="Bağ Fiyatı">
                    <textarea id="inputDesc${i}" oninput="update(${i})" class="w-full p-4 rounded-xl text-[10px] h-20 resize-none" placeholder="Ürün Açıklaması..."></textarea>
                </div>`;
        }

        // DOSYA YÜKLEME İŞLEMİ
        function handleFile(i, input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onloadend = function() {
                document.getElementById(`prodImg${i}`).src = reader.result;
                localStorage.setItem(`img_${i}`, reader.result);
            }
            if (file) reader.readAsDataURL(file);
        }

        function update(i) {
            let n = document.getElementById(`inputName${i}`).value || `Ürün ${i}`;
            let p = document.getElementById(`inputPrice${i}`).value || "400";
            let d = document.getElementById(`inputDesc${i}`).value || "Ürün açıklaması burada yer alacak.";
            
            document.getElementById(`prodName${i}`).innerText = n;
            document.getElementById(`prodPriceDisplay${i}`).innerText = parseFloat(p).toLocaleString('tr-TR', {minimumFractionDigits:2});
            document.getElementById(`prodDescDisplay${i}`).innerText = d;
            
            localStorage.setItem(`n_${i}`, n);
            localStorage.setItem(`p_raw_${i}`, p);
            localStorage.setItem(`d_${i}`, d);
        }

        function addToCart(i) {
            const name = document.getElementById(`prodName${i}`).innerText;
            const rawPrice = parseFloat(localStorage.getItem(`p_raw_${i}`) || 400);
            const img = document.getElementById(`prodImg${i}`).src;
            const paketFiyati = rawPrice * 25; 

            const index = sepet.findIndex(item => item.name === name);
            if(index > -1) {
                sepet[index].qty += 1;
            } else {
                sepet.push({ name, price: paketFiyati, img, qty: 1 });
            }
            updateSepet();
            toggleSepet();
        }

        function miktarDegistir(index, fark) {
            sepet[index].qty += fark;
            if(sepet[index].qty < 1) sepet.splice(index, 1);
            updateSepet();
        }

        function updateSepet() {
            localStorage.setItem('hasir_sepet_v16', JSON.stringify(sepet));
            document.getElementById('sepetAdet').innerText = sepet.reduce((acc, obj) => acc + obj.qty, 0);
            const list = document.getElementById('sepetListesi');
            let total = 0;
            list.innerHTML = "";
            
            sepet.forEach((item, index) => {
                const ara = item.price * item.qty;
                total += ara;
                list.innerHTML += `
                    <div class="bg-white/5 p-6 rounded-[2rem] border border-white/5 flex flex-col gap-6">
                        <div class="flex gap-6 items-center">
                            <img src="${item.img}" class="w-20 h-20 object-cover rounded-2xl">
                            <div class="flex-1">
                                <h4 class="font-black text-sm uppercase italic text-white leading-tight">${item.name}</h4>
                                <p class="text-emerald-500 font-bold text-[10px] uppercase mt-2 italic tracking-widest">${item.qty * 25} Bağ</p>
                            </div>
                        </div>
                        <div class="flex items-center justify-between border-t border-white/5 pt-6">
                            <div class="flex items-center gap-4 bg-black rounded-xl p-1">
                                <button onclick="miktarDegistir(${index}, -1)" class="w-8 h-8 text-zinc-500 hover:text-white">-</button>
                                <span class="font-black text-xs">${item.qty} Pkt</span>
                                <button onclick="miktarDegistir(${index}, 1)" class="w-8 h-8 bg-emerald-600 rounded-lg text-white">+</button>
                            </div>
                            <span class="font-black text-white italic">₺${ara.toLocaleString('tr-TR', {minimumFractionDigits:2})}</span>
                        </div>
                    </div>`;
            });
            document.getElementById('sepetToplam').innerText = `₺${total.toLocaleString('tr-TR', {minimumFractionDigits:2})}`;
        }

        function whatsappSepetGonder() {
            if(sepet.length === 0) return;
            let msg = "*HASİRPLAST SİPARİŞ FORMU*\n\n";
            sepet.forEach(i => {
                msg += `📦 *${i.name}*\n   Miktar: ${i.qty * 25} Bağ\n   Tutar: ₺${(i.price * i.qty).toLocaleString('tr-TR', {minimumFractionDigits:2})}\n\n`;
            });
            msg += `✅ *GENEL TOPLAM:* ${document.getElementById('sepetToplam').innerText}`;
            window.open(`https://api.whatsapp.com/send?phone=${NO}&text=${encodeURIComponent(msg)}`);
        }

        function toggleSepet() {
            const s = document.getElementById('sepetSidebar');
            s.style.transform = s.style.transform === 'translateX(0%)' ? 'translateX(100%)' : 'translateX(0%)';
            document.getElementById('sepetOverlay').classList.toggle('hidden');
        }

        window.onload = () => {
            for(let i=1; i<=8; i++) {
                let n = localStorage.getItem(`n_${i}`) || "";
                let p = localStorage.getItem(`p_raw_${i}`) || "400";
                let d = localStorage.getItem(`d_${i}`) || "";
                let img = localStorage.getItem(`img_${i}`) || "antrasit.jpeg";
                
                document.getElementById(`prodImg${i}`).src = img;
                document.getElementById(`inputName${i}`).value = n;
                document.getElementById(`inputPrice${i}`).value = p;
                document.getElementById(`inputDesc${i}`).value = d;
                update(i);
            }
            updateSepet();
        };
    </script>
</body>
</html>
