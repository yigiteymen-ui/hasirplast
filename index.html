<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HasırPlast | Kaliteli Hasır Çeşitleri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Panel kapalıyken kesinlikle gözükmesin */
        .admin-gizli { display: none !important; }
    </style>
</head>
<body class="bg-zinc-50 font-sans">

    <nav class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="text-2xl font-bold text-emerald-700">HasırPlast</div>
            <div class="hidden md:flex space-x-8 text-zinc-600 font-medium">
                <a href="#" class="hover:text-emerald-600">Ana Sayfa</a>
                <a href="#" class="hover:text-emerald-600">Ürünler</a>
                <a href="#" class="hover:text-emerald-600">İletişim</a>
            </div>
            <button class="bg-emerald-600 text-white px-5 py-2 rounded-full text-sm font-semibold hover:bg-emerald-700 transition">Teklif Al</button>
        </div>
    </nav>

    <header class="relative h-[400px] flex items-center justify-center text-center text-white">
        <div class="absolute inset-0 z-0">
            <img src="Piknik Hasırı.jpeg" class="w-full h-full object-cover brightness-50" alt="HasırPlast">
        </div>
        <div class="relative z-10 px-4">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-4 uppercase">Hasırda Kalite ve Estetik</h1>
            <p class="text-lg max-w-xl mx-auto opacity-90">Cami, mescit ve bahçeleriniz için profesyonel çözümler.</p>
        </div>
    </header>

    <section class="max-w-7xl mx-auto py-12 px-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white rounded-xl shadow-md p-4">
                <img src="antrasit.jpeg" class="w-full h-48 object-cover rounded-lg mb-4">
                <h3 class="font-bold text-lg">Antrasit Seri</h3>
                <p class="text-emerald-700 font-bold">250 TL / m²</p>
            </div>
            <div class="bg-white rounded-xl shadow-md p-4">
                <img src="antrasit2.jpeg" class="w-full h-48 object-cover rounded-lg mb-4">
                <h3 class="font-bold text-lg">Seccade Tipi</h3>
                <p class="text-emerald-700 font-bold">180 TL / Adet</p>
            </div>
            <div class="bg-white rounded-xl shadow-md p-4">
                <img src="Piknik Hasırı.jpeg" class="w-full h-48 object-cover rounded-lg mb-4">
                <h3 class="font-bold text-lg">Piknik Hasırı</h3>
                <p class="text-emerald-700 font-bold">320 TL</p>
            </div>
        </div>
    </section>

    <footer class="bg-zinc-900 text-white py-10 px-4 text-center">
        <p class="text-zinc-400 mb-4">Türkiye'nin her yerine gönderim.</p>
        <p onclick="panelAc()" class="text-zinc-600 text-xs cursor-default select-none">
            © 2026 HasırPlast. Tüm Hakları Saklıdır.
        </p>
    </footer>

    <div id="adminPanel" class="fixed inset-y-0 left-0 w-72 bg-zinc-800 text-white p-6 shadow-2xl z-50 admin-gizli">
        <h2 class="text-xl font-bold mb-6 text-emerald-400 border-b border-zinc-700 pb-2">Yönetim</h2>
        <div class="space-y-4">
            <button class="w-full bg-zinc-700 p-2 rounded text-left">Fiyatları Değiştir</button>
            <button class="w-full bg-zinc-700 p-2 rounded text-left">Ürün Ekle</button>
            <button onclick="document.getElementById('adminPanel').classList.add('admin-gizli')" class="w-full bg-red-900/50 text-red-300 p-2 rounded mt-10">Paneli Kapat</button>
        </div>
    </div>

    <script>
        function panelAc() {
            let sifre = prompt("Yetkili Şifresini Giriniz:");
            if (sifre === "nmkhasir") {
                document.getElementById('adminPanel').classList.remove('admin-gizli');
            } else if (sifre !== null) {
                alert("Hatalı Şifre!");
            }
        }

        // CTRL + P yine de çalışsın (Yedek olarak)
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key.toLowerCase() === 'p') {
                e.preventDefault();
                panelAc();
            }
        });
    </script>

</body>
</html>
