<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASİRPLAST | Toptan Hasır</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000; color: #fff; }
        .admin-gizli, .modal-gizli { display: none !important; }
        .product-card { background: #0a0a0a; border: 1px solid #1a1a1a; transition: all 0.4s ease; }
        .product-card:hover { border-color: #10b981; transform: translateY(-5px); }
        .dark-glass { background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px); border-left: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body>

    <div id="adminPanel" class="fixed inset-y-0 left-0 w-[320px] dark-glass p-6 z-[300] overflow-y-auto admin-gizli">
        <h3 class="text-emerald-500 font-black uppercase text-xs tracking-widest mb-6">Ürün Yönetimi</h3>
        <div id="productEditorFields" class="space-y-6"></div>
        <button onclick="localStorage.clear(); location.reload();" class="w-full mt-8 py-3 bg-red-900/20 text-red-500 rounded-xl text-[10px] font-bold border border-red-900/30">Sıfırla</button>
    </div>

    <div id="sepetOverlay" onclick="toggleSepet()" class="fixed inset-0 bg-black/80 z-[210] hidden backdrop-blur-sm"></div>
    <div id="sepetSidebar" class="fixed inset-y-0 right-0 w-full md:w-[400px] dark-glass z-[220] translate-x-full transition-transform duration-500 flex flex-col">
        <div class="p-8 border-b border-white/5 flex justify-between items-center">
            <h3 class="text-xl font-black italic uppercase">Sipariş Listem</h3>
            <button onclick="toggleSepet()" class="text-3xl">&times;</button>
        </div>
        <div id="sepetListesi" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
        <div class="p-8 bg-zinc-900/50">
            <div class="flex justify-between items-end mb-6">
                <span class="text-zinc-500 font-bold uppercase text-[10px]">Genel Toplam</span>
                <span id="sepetToplam" class="text-3xl font-black text-emerald-500 italic">₺0,00</span>
            </div>
            <button onclick="whatsappSepetGonder()" class="w-full bg-emerald-600 py-5 rounded-xl font-black uppercase text-xs">Siparişi Onayla</button>
        </div>
    </div>

    <nav class="fixed top-0 inset-x-0 z-[150] px-8 py-6 flex justify-between items-center bg-black/50 backdrop-blur-lg">
        <div class="font-black italic text-2xl tracking-tighter">HASİR<span class="text-emerald-500">PLAST</span></div>
        <button onclick="toggleSepet()" class="bg-white/5 p-4 rounded-xl relative">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="sepetAdet" class="absolute -top-1 -right-1 bg-emerald-500 text-black text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center">0</span>
        </button>
    </nav>

    <section class="pt-32 pb-20 px-8">
        <div class="container mx-auto">
            <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </div>
    </section>

    <script>
        const NO = "905336586270";
        let sepet = JSON.parse(localStorage.getItem('hasir_sepet_v14')) || [];
        
        // 8 ÜRÜNÜ OLUŞTUR
        for(let i=1; i<=8; i++) {
            document.getElementById('productGrid').innerHTML += `
                <div class="product-card rounded-[2rem] overflow-hidden p-6 text-center">
                    <img id="prodImg${i}" src="antrasit.jpeg" class="w-full h-64 object-cover rounded-2xl mb-6 opacity-80">
                    <div class="mb-4">
                        <span class="bg-emerald-500/10 text-emerald-500 text-[9px] font-black px-3 py-1 rounded-full uppercase">25 Adet (1 Bağ)</span>
                    </div>
                    <h3 id="prodName${i}" class="font-black text-lg uppercase italic mb-2">Ürün ${i}</h3>
                    <div class="text-emerald-500 font-black text-2xl mb-6 italic">₺<span id="prodPriceDisplay${i}">400,00</span></div>
                    <button onclick="addToCart(${i})" class="w-full bg-white text-black py-4 rounded-xl font-black uppercase text-[10px] hover:bg-emerald-500 hover:text-white transition">Sepete Ekle</button>
                </div>`;
            
            document.getElementById('productEditorFields').innerHTML += `
                <div class="bg-white/5 p-4 rounded-2xl border border-white/5 space-y-3">
                    <input type="text" id="inputName${i}" oninput="update(${i})" class="w-full p-3 rounded-lg text-[10px]" placeholder="Ürün Adı">
                    <input type="number" id="inputPrice${i}" oninput="update(${i})" class="w-full p-3 rounded-lg text-[10px]" placeholder="Bağ Fiyatı (Örn: 400)">
                </div>`;
        }

        function update(i) {
            let n = document.getElementById(`inputName${i}`).value || `Ürün ${i}`;
            let p = document.getElementById(`inputPrice${i}`).value || "400";
            
            document.getElementById(`prodName${i}`).innerText = n;
            // Sitede sadece girilen 400 gözükecek
            document.getElementById(`prodPriceDisplay${i}`).innerText = parseFloat(p).toLocaleString('tr-TR', {minimumFractionDigits:2});
            
            localStorage.setItem(`n_${i}`, n);
            localStorage.setItem(`p_raw_${i}`, p);
        }

        function addToCart(i) {
            const name = document.getElementById(`prodName${i}`).innerText;
            const rawPrice = parseFloat(localStorage.getItem(`p_raw_${i}`) || 400);
            const img = document.getElementById(`prodImg${i}`).src;
            
            // MATEMATİK BURADA: Sepete eklerken bağ fiyatını 25 ile çarpıyoruz
            const paketFiyati = rawPrice * 25; 

            const index = sepet.findIndex(item => item.name === name);
            if(index > -1) {
                sepet[index].qty += 1;
            } else {
                sepet.push({ name, price: paketFiyati, img, qty: 1 });
            }
            updateSepet();
            toggleSepet();
        }

        function updateSepet() {
            localStorage.setItem('hasir_sepet_v14', JSON.stringify(sepet));
            document.getElementById('sepetAdet').innerText = sepet.reduce((acc, obj) => acc + obj.qty, 0);
            const list = document.getElementById('sepetListesi');
            let total = 0;
            list.innerHTML = "";
            
            sepet.forEach((item, index) => {
                const ara = item.price * item.qty;
                total += ara;
                list.innerHTML += `
                    <div class="bg-white/5 p-4 rounded-2xl flex gap-4 items-center border border-white/5">
                        <img src="${item.img}" class="w-12 h-12 object-cover rounded-lg">
                        <div class="flex-1">
                            <h4 class="font-black text-[10px] uppercase">${item.name}</h4>
                            <p class="text-emerald-500 font-bold text-[9px] uppercase">${item.qty * 25} Bağ (1 Paket)</p>
                            <p class="font-black text-white mt-1">₺${ara.toLocaleString('tr-TR', {minimumFractionDigits:2})}</p>
                        </div>
                        <button onclick="miktar(${index}, -1)" class="text-zinc-500 px-2">&times;</button>
                    </div>`;
            });
            document.getElementById('sepetToplam').innerText = `₺${total.toLocaleString('tr-TR', {minimumFractionDigits:2})}`;
        }

        function miktar(index, fark) {
            sepet[index].qty += fark;
            if(sepet[index].qty < 1) sepet.splice(index, 1);
            updateSepet();
        }

        function whatsappSepetGonder() {
            let msg = "*HASİRPLAST SİPARİŞ FORMU*\n\n";
            sepet.forEach(i => {
                msg += `📦 *${i.name}*\n   Miktar: ${i.qty * 25} Bağ\n   Tutar: ₺${(i.price * i.qty).toLocaleString('tr-TR', {minimumFractionDigits:2})}\n\n`;
            });
            msg += `✅ *GENEL TOPLAM:* ${document.getElementById('sepetToplam').innerText}`;
            window.open(`https://api.whatsapp.com/send?phone=${NO}&text=${encodeURIComponent(msg)}`);
        }

        function toggleSepet() {
            const s = document.getElementById('sepetSidebar');
            s.style.transform = s.style.transform === 'translateX(0%)' ? 'translateX(100%)' : 'translateX(0%)';
            document.getElementById('sepetOverlay').classList.toggle('hidden');
        }

        function panelGiris() { if(prompt("Şifre:") === "nmkhasir") document.getElementById('adminPanel').classList.toggle('admin-gizli'); }

        window.onload = () => {
            for(let i=1; i<=8; i++) {
                document.getElementById(`inputName${i}`).value = localStorage.getItem(`n_${i}`) || "";
                document.getElementById(`inputPrice${i}`).value = localStorage.getItem(`p_raw_${i}`) || "400";
                update(i);
            }
            updateSepet();
        };
    </script>
    <footer class="py-10 text-center opacity-20 hover:opacity-100 cursor-pointer text-[10px] uppercase font-bold tracking-widest" onclick="panelGiris()">Yönetim Paneli</footer>
</body>
</html>
