<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HasırPlast | Profesyonel Hasır Sistemleri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-gizli { display: none !important; }
        .map-container iframe { width: 100%; height: 300px; border-radius: 1rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div id="adminPanel" class="fixed inset-y-0 left-0 w-80 bg-zinc-900 text-white p-6 shadow-2xl z-50 overflow-y-auto admin-gizli border-r border-emerald-500/30">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-bold text-emerald-400 italic">YÖNETİM</h3>
            <button onclick="togglePanel()" class="text-gray-400 hover:text-white text-3xl">&times;</button>
        </div>
        <div id="productEditorFields" class="space-y-4"></div>
        <button onclick="localStorage.clear(); location.reload();" class="w-full mt-8 bg-red-900/20 text-red-500 text-[10px] font-bold py-3 rounded border border-red-800/30 uppercase">Sıfırla</button>
    </div>

    <nav class="bg-white shadow-sm sticky top-0 z-40 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-emerald-700 italic tracking-tighter">HASİRPLAST</h1>
            <div class="flex gap-4">
                <a href="tel:+905336586270" class="bg-zinc-100 text-zinc-800 px-4 py-2 rounded-lg font-bold text-xs flex items-center">
                    <i class="fa-solid fa-phone mr-2"></i> ARA
                </a>
                <a href="https://wa.me/905336586270" target="_blank" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold text-xs shadow-lg uppercase">Teklif Al</a>
            </div>
        </div>
    </nav>

    <section class="py-12 px-4 bg-zinc-100">
        <div class="container mx-auto">
            <h2 class="text-3xl font-black mb-8 italic uppercase border-l-4 border-emerald-600 pl-4 text-zinc-900">Ürün Kataloğu</h2>
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </div>
    </section>

    <section id="iletisim" class="py-16 bg-white px-4 border-t">
        <div class="container mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
            <div>
                <h2 class="text-3xl font-black mb-6 italic uppercase">İletişim & Adres</h2>
                <div class="space-y-6">
                    <div class="flex items-start">
                        <i class="fa-solid fa-location-dot text-emerald-600 text-2xl mt-1 mr-4"></i>
                        <p class="font-bold text-gray-700">İnönü, 359. Sk, 34203<br>Bağcılar/İstanbul, Türkiye</p>
                    </div>
                    <div class="flex items-center">
                        <i class="fa-solid fa-phone text-emerald-600 text-2xl mr-4"></i>
                        <a href="tel:+905336586270" class="text-2xl font-black text-zinc-900 hover:text-emerald-700 transition">+90 533 658 62 70</a>
                    </div>
                </div>
            </div>
            <div class="map-container shadow-2xl">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3009.689717540248!2d28.828859712398462!3d41.03199851780447!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14caa50367f082e1%3A0x67396117366d0342!2zSW7bsO8LCAzNTkuIFNrLiwgMzQyMDMgQmHEn2PEsWxhci_EsHN0YW5idWw!5e0!3m2!1str!2str!4v1715890000000!5m2!1str!2str" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
    </section>

    <footer class="bg-zinc-900 text-gray-500 py-10 text-center border-t border-zinc-800">
        <p onclick="panelGiris()" class="text-[10px] uppercase font-bold cursor-default select-none opacity-40">© 2026 HasırPlast - Bağcılar / İstanbul</p>
    </footer>

    <a href="https://api.whatsapp.com/send?phone=905336586270" target="_blank" class="fixed bottom-6 right-6 bg-green-500 text-white w-16 h-16 rounded-full flex items-center justify-center text-4xl shadow-2xl z-50 hover:scale-110 transition">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <script>
        const NO = "905336586270";
        const grid = document.getElementById('productGrid');
        const editor = document.getElementById('productEditorFields');

        // Üretim
        for(let i=1; i<=8; i++) {
            grid.innerHTML += `
                <div class="bg-white rounded-2xl shadow-sm border overflow-hidden flex flex-col hover:shadow-lg transition">
                    <img id="prodImg${i}" src="antrasit.jpeg" class="w-full h-48 object-cover">
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <h3 id="prodName${i}" class="font-black text-lg uppercase italic text-zinc-800">Ürün ${i}</h3>
                        <div class="flex justify-between items-center mt-4 border-t pt-3">
                            <span class="text-emerald-700 font-black text-xl italic">₺<span id="prodPrice${i}">0</span></span>
                            <button onclick="siparis(${i})" class="bg-zinc-900 text-white px-4 py-2 rounded-lg font-black text-[10px] uppercase transition">Sipariş</button>
                        </div>
                    </div>
                </div>`;
            editor.innerHTML += `
                <div class="bg-zinc-800 p-3 rounded-lg border border-zinc-700 mb-2 text-xs">
                    <span class="text-emerald-500 font-bold block mb-1 uppercase">Ürün ${i}</span>
                    <input type="text" id="inputName${i}" oninput="update(${i})" class="w-full bg-zinc-700 p-2 mb-2 rounded outline-none" placeholder="İsim">
                    <input type="number" id="inputPrice${i}" oninput="update(${i})" class="w-full bg-zinc-700 p-2 rounded outline-none" placeholder="Fiyat">
                </div>`;
        }

        function siparis(i) {
            const isim = document.getElementById(`prodName${i}`).innerText;
            const fiyat = document.getElementById(`prodPrice${i}`).innerText;
            const link = `https://api.whatsapp.com/send?phone=${NO}&text=Merhaba, *${isim}* ürünü için bilgi almak istiyorum. Fiyat: ${fiyat} TL.`;
            window.open(link, '_blank');
        }

        function panelGiris() { if(prompt("Şifre:") === "nmkhasir") togglePanel(); }
        function togglePanel() { document.getElementById('adminPanel').classList.toggle('admin-gizli'); }
        document.addEventListener('keydown', e => { if(e.ctrlKey && e.key.toLowerCase() === 'p') { e.preventDefault(); panelGiris(); } });

        window.onload = () => {
            for(let i=1; i<=8; i++) {
                let n = localStorage.getItem(`n_${i}`) || "Premium Hasır";
                let p = localStorage.getItem(`p_${i}`) || "250,00";
                document.getElementById(`prodName${i}`).innerText = n;
                document.getElementById(`prodPrice${i}`).innerText = p;
                document.getElementById(`inputName${i}`).value = n;
                document.getElementById(`inputPrice${i}`).value = p.replace(',00', '').replace(',', '.');
            }
        };

        function update(i) {
            let n = document.getElementById(`inputName${i}`).value;
            let p = document.getElementById(`inputPrice${i}`).value;
            let f = parseFloat(p || 0).toFixed(2).replace('.', ',');
            document.getElementById(`prodName${i}`).innerText = n;
            document.getElementById(`prodPrice${i}`).innerText = f;
            localStorage.setItem(`n_${i}`, n);
            localStorage.setItem(`p_${i}`, f);
        }
    </script>
</body>
</html>
