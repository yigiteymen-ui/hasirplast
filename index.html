<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASİRPLAST | Toptan Plastik Hasır Kilim ve Cami Hasırı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; scroll-behavior: smooth; }
        .admin-gizli { display: none !important; }
        
        /* Fotoğrafın Kart İçinde Sabit ve Düzgün Durması İçin */
        .product-card { 
            transition: all 0.4s ease; 
            border-radius: 2.5rem; 
            background: white; 
            border: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
        }
        
        .image-holder {
            position: relative;
            width: 100%;
            padding-top: 100%; /* Tam Kare Oran */
            overflow: hidden;
            border-radius: 2rem;
            background-color: #f8f8f8;
        }

        .image-holder img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Fotoğrafı alanı dolduracak şekilde sığdırır */
            transition: transform 0.6s ease;
        }

        .product-card:hover img { transform: scale(1.08); }
        .product-card:hover { transform: translateY(-10px); border-color: #10b981; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.05); }
        
        /* SEO Yazı Stilleri */
        .seo-grid-item { font-size: 11px; font-weight: 600; color: #64748b; padding: 2px 0; }
        .seo-section-title { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #10b981; margin-bottom: 1rem; display: block; letter-spacing: 1px; }
        
        .full-detail-view { position: fixed; inset: 0; background: white; z-index: 2000; display: none; overflow-y: auto; }
        .full-detail-active { display: block !important; }
    </style>
</head>
<body class="overflow-x-hidden">

    <header class="fixed top-0 inset-x-0 z-[500] bg-white/90 backdrop-blur-xl border-b py-4 px-6">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
                    <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center text-white"><i class="fa-solid fa-cube"></i></div>
                    <span class="text-xl font-black italic uppercase tracking-tighter">HASİR<span class="text-emerald-500">PLAST</span></span>
                </div>
                <button onclick="toggleSepet(true)" class="relative bg-zinc-100 w-12 h-12 rounded-xl flex items-center justify-center hover:bg-emerald-500 hover:text-white transition-all">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="sepetAdet" class="absolute -top-2 -right-2 bg-emerald-600 text-white text-[10px] font-black w-6 h-6 rounded-full flex items-center justify-center border-2 border-white">0</span>
                </button>
            </div>
            <div class="hidden md:block flex-1 max-w-md mx-10">
                <input type="text" id="siteSearch" oninput="performSearch()" placeholder="Cami hasırı, kilim ara..." class="w-full py-3 px-6 rounded-xl bg-zinc-50 border-none text-xs font-bold focus:ring-2 ring-emerald-500 transition-all">
            </div>
        </div>
    </header>

    <main class="pt-32 pb-20 px-6">
        <div class="container mx-auto">
            <div class="mb-12 text-center">
                <h2 class="text-4xl font-black italic uppercase tracking-tighter mb-2">Ürün Kataloğu</h2>
                <div class="h-1 w-20 bg-emerald-500 mx-auto rounded-full"></div>
            </div>
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </div>
    </main>

    <div id="fullDetail" class="full-detail-view">
        <div class="container mx-auto px-6 py-12">
            <button onclick="closeDetail()" class="mb-8 flex items-center gap-2 font-black uppercase text-xs tracking-widest hover:text-emerald-500 transition-all">
                <i class="fa-solid fa-arrow-left"></i> Ürünlere Dön
            </button>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-16">
                <div class="rounded-[2.5rem] overflow-hidden bg-zinc-100 shadow-xl aspect-square">
                    <img id="d_img" src="" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col justify-center">
                    <span class="text-emerald-500 font-black uppercase tracking-widest text-[10px] mb-2">HASİRPLAST KALİTESİ</span>
                    <h1 id="d_name" class="text-5xl font-black uppercase italic mb-6 tracking-tighter"></h1>
                    <div class="bg-zinc-50 p-8 rounded-[2rem] mb-10 border border-zinc-100">
                        <p id="d_desc" class="text-zinc-600 leading-relaxed italic">Bu ürün UV katkılı, su geçirmez ve toptan satışa uygun olarak üretilmiştir.</p>
                    </div>
                    <div class="flex items-center gap-10">
                        <div>
                            <p class="text-[10px] font-black text-zinc-400 uppercase mb-1">Bağ Fiyatı (25 Adet)</p>
                            <span class="text-5xl font-black italic text-emerald-600">₺<span id="d_total">0</span></span>
                        </div>
                        <button id="d_add_btn" class="flex-1 bg-black text-white py-6 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-emerald-500 transition-all shadow-lg">
                            Sepete Ekle
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <section class="py-24 bg-white border-y px-6">
        <div class="container mx-auto">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-16">
                <div>
                    <span class="seo-section-title">Anadolu Yakası Sevkiyat</span>
                    <div class="grid grid-cols-2 gap-x-4" id="seoAnadolu">
                        </div>
                </div>
                <div>
                    <span class="seo-section-title">Avrupa Yakası Sevkiyat</span>
                    <div class="grid grid-cols-2 gap-x-4" id="seoAvrupa">
                        </div>
                </div>
                <div class="lg:col-span-1">
                    <span class="seo-section-title">Türkiye Geneli Toptan</span>
                    <div class="grid grid-cols-2 gap-x-4" id="seoTurkiye">
                        </div>
                </div>
            </div>
        </div>
    </section>

    <div id="sepetOverlay" onclick="toggleSepet(false)" class="fixed inset-0 bg-black/40 z-[1000] hidden backdrop-blur-sm"></div>
    <div id="sepetSidebar" class="fixed inset-y-0 right-0 w-full md:w-[400px] bg-white z-[1100] translate-x-full transition-transform duration-500 flex flex-col shadow-2xl">
        <div class="p-8 border-b flex justify-between items-center">
            <h3 class="text-xl font-black italic uppercase">Sepetim</h3>
            <button onclick="toggleSepet(false)" class="text-3xl font-light hover:text-emerald-500">✕</button>
        </div>
        <div id="sepetListesi" class="flex-1 overflow-y-auto p-8 space-y-4"></div>
        <div class="p-8 border-t bg-zinc-50 space-y-4">
            <div class="flex justify-between items-center">
                <span class="text-zinc-400 font-bold text-xs uppercase">Toplam</span>
                <span class="text-3xl font-black italic text-emerald-600">₺<span id="genelToplam">0</span></span>
            </div>
            <button onclick="whatsappGonder()" class="w-full bg-emerald-600 text-white py-5 rounded-2xl font-black uppercase text-[10px] tracking-widest hover:bg-emerald-500 shadow-xl transition-all">
                WhatsApp İle Sipariş Ver
            </button>
        </div>
    </div>

    <div id="adminPanel" class="fixed inset-y-0 left-0 w-[320px] bg-white shadow-2xl p-6 z-[3000] admin-gizli border-r overflow-y-auto">
        <div class="flex justify-between items-center mb-8 border-b pb-4">
            <h3 class="font-black text-xs text-emerald-500 uppercase">Panel</h3>
            <button onclick="adminCikis()" class="text-[10px] font-bold text-red-500">KAPAT</button>
        </div>
        <div id="adminFields" class="space-y-6"></div>
    </div>

    <script>
        let sepet = JSON.parse(localStorage.getItem('hasir_sepet_v12')) || [];
        const grid = document.getElementById('productGrid');
        const fields = document.getElementById('adminFields');

        // Ürün ve Admin Alanlarını Hazırla
        for(let i=1; i<=8; i++) {
            grid.innerHTML += `
                <div id="card${i}" class="product-card p-5 cursor-pointer" onclick="openDetail(${i})">
                    <div class="image-holder mb-6">
                        <img id="img${i}" src="antrasit.jpeg">
                    </div>
                    <div class="flex flex-col flex-1">
                        <h3 id="name${i}" class="font-black uppercase italic text-lg mb-1 tracking-tighter">Model ${i}</h3>
                        <p class="text-zinc-400 text-[10px] font-black uppercase mb-6 italic tracking-widest">25 Adet / Bağ</p>
                        <div class="mt-auto flex justify-between items-center" onclick="event.stopPropagation()">
                            <span class="text-2xl font-black italic">₺<span id="price${i}">0</span></span>
                            <button onclick="sepeteEkle(${i})" class="w-12 h-12 bg-zinc-50 rounded-xl hover:bg-emerald-500 hover:text-white transition-all flex items-center justify-center">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
            
            fields.innerHTML += `
                <div class="p-4 bg-zinc-50 rounded-xl border space-y-3">
                    <p class="font-black text-[9px] uppercase text-zinc-400">Ürün ${i}</p>
                    <input type="file" onchange="fotoGuncelle(${i}, this)" class="text-[10px] w-full">
                    <input type="text" id="in_name${i}" oninput="kaydet(${i})" placeholder="İsim" class="w-full p-2 border rounded text-xs font-bold">
                    <input type="number" id="in_price${i}" oninput="kaydet(${i})" placeholder="Fiyat" class="w-full p-2 border rounded text-xs font-bold">
                </div>`;
        }

        // SEO Listesi Doldurma
        const anadolu = ["Ataşehir", "Beykoz", "Çekmeköy", "Kadıköy", "Kartal", "Maltepe", "Pendik", "Sancaktepe", "Ümraniye", "Üsküdar"];
        const avrupa = ["Arnavutköy", "Avcılar", "Bağcılar", "Bakırköy", "Başakşehir", "Beşiktaş", "Beylikdüzü", "Esenyurt", "Fatih", "Şişli"];
        const iller = ["Ankara", "İzmir", "Bursa", "Antalya", "Adana", "Konya", "Gaziantep", "Kayseri", "Samsun", "Mersin"];

        const fillSEO = (list, id) => {
            const el = document.getElementById(id);
            list.forEach(city => el.innerHTML += `<span class="seo-grid-item">${city} Hasır</span>`);
        };
        fillSEO(anadolu, "seoAnadolu"); fillSEO(avrupa, "seoAvrupa"); fillSEO(iller, "seoTurkiye");

        // Fonksiyonlar
        function kaydet(i) {
            const name = document.getElementById(`in_name${i}`).value || "Model " + i;
            const price = parseFloat(document.getElementById(`in_price${i}`).value) || 0;
            document.getElementById(`name${i}`).innerText = name;
            document.getElementById(`price${i}`).innerText = price.toLocaleString();
            localStorage.setItem(`data_v12_${i}`, JSON.stringify({name, price}));
        }

        function fotoGuncelle(i, f) { 
            if (f.files[0]) { 
                const r = new FileReader(); 
                r.onload = e => { 
                    document.getElementById(`img${i}`).src = e.target.result; 
                    localStorage.setItem(`img_v12_${i}`, e.target.result); 
                }; 
                r.readAsDataURL(f.files[0]); 
            } 
        }

        function sepeteEkle(i) {
            const data = JSON.parse(localStorage.getItem(`data_v12_${i}`)) || { name: "Model "+i, price: 0 };
            const bagPrice = data.price * 25;
            const idx = sepet.findIndex(s => s.id === i);
            if(idx > -1) sepet[idx].qty++; else sepet.push({id: i, name: data.name, price: bagPrice, qty: 1});
            sepetGuncelle();
            toggleSepet(true);
        }

        function sepetGuncelle() {
            localStorage.setItem('hasir_sepet_v12', JSON.stringify(sepet));
            document.getElementById('sepetAdet').innerText = sepet.reduce((a, b) => a + b.qty, 0);
            const list = document.getElementById('sepetListesi'); list.innerHTML = ""; let total = 0;
            sepet.forEach((item, idx) => {
                total += item.price * item.qty;
                list.innerHTML += `<div class="flex items-center gap-4 bg-zinc-50 p-4 rounded-xl border">
                    <div class="flex-1"><h4 class="font-black text-[10px] uppercase">${item.name}</h4><p class="text-emerald-600 font-bold text-xs">₺${(item.price * item.qty).toLocaleString()}</p></div>
                    <div class="flex items-center gap-2">
                        <button onclick="degistir(${idx}, -1)" class="w-6 h-6 bg-white border rounded text-xs">-</button>
                        <span class="text-xs font-bold">${item.qty}</span>
                        <button onclick="degistir(${idx}, 1)" class="w-6 h-6 bg-black text-white rounded text-xs">+</button>
                    </div>
                </div>`;
            });
            document.getElementById('genelToplam').innerText = total.toLocaleString();
        }

        function degistir(i, v) { sepet[i].qty += v; if(sepet[i].qty < 1) sepet.splice(i, 1); sepetGuncelle(); }
        function toggleSepet(s) { 
            document.getElementById('sepetSidebar').style.transform = s ? 'translateX(0%)' : 'translateX(100%)'; 
            document.getElementById('sepetOverlay').classList.toggle('hidden', !s); 
        }

        function openDetail(i) {
            const data = JSON.parse(localStorage.getItem(`data_v12_${i}`)) || { name: "Model "+i, price: 0 };
            document.getElementById('d_img').src = document.getElementById(`img${i}`).src;
            document.getElementById('d_name').innerText = data.name;
            document.getElementById('d_total').innerText = (data.price * 25).toLocaleString();
            document.getElementById('d_add_btn').onclick = () => { sepeteEkle(i); closeDetail(); };
            document.getElementById('fullDetail').classList.add('full-detail-active');
        }

        function closeDetail() { document.getElementById('fullDetail').classList.remove('full-detail-active'); }
        function adminCikis() { document.getElementById('adminPanel').classList.add('admin-gizli'); }
        function performSearch() {
            const q = document.getElementById('siteSearch').value.toLowerCase();
            document.querySelectorAll('.product-card').forEach(c => {
                c.style.display = c.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
            });
        }

        function whatsappGonder() {
            let t = "*HASİRPLAST YENİ SİPARİŞ*\n\n";
            sepet.forEach(i => t += `📦 *${i.name}* - ${i.qty} Bağ\n`);
            t += `\n*Toplam: ₺${document.getElementById('genelToplam').innerText}*`;
            window.open(`https://wa.me/905336586270?text=${encodeURIComponent(t)}`);
        }

        document.addEventListener('keydown', e => { 
            if (e.ctrlKey && e.key === 'p') { 
                e.preventDefault(); 
                if(prompt("Şifre:") === "nmkhasir") document.getElementById('adminPanel').classList.toggle('admin-gizli'); 
            } 
        });

        window.onload = () => {
            for(let i=1; i<=8; i++) {
                const d = JSON.parse(localStorage.getItem(`data_v12_${i}`)); 
                const im = localStorage.getItem(`img_v12_${i}`);
                if(d) { 
                    document.getElementById(`in_name${i}`).value = d.name; 
                    document.getElementById(`in_price${i}`).value = d.price; 
                    document.getElementById(`name${i}`).innerText = d.name;
                    document.getElementById(`price${i}`).innerText = d.price.toLocaleString();
                }
                if(im) document.getElementById(`img${i}`).src = im;
            }
            sepetGuncelle();
        };
    </script>
</body>
</html>
