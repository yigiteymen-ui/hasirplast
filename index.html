<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASİRPLAST | Yönetim Panelli Profesyonel Sistem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f5f2ed; color: #1a1a1a; scroll-behavior: smooth; }
        .premium-header { background: rgba(245, 242, 237, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .admin-panel { background: #1a1a1a; color: white; display: none; }
        .welcome-bg { background: #000; transition: 0.8s cubic-bezier(0.85, 0, 0.15, 1); }
        .hidden-screen { transform: translateY(-100%); pointer-events: none; }
    </style>
</head>
<body onload="initApp()">

    <section id="welcomeScreen" class="fixed inset-0 z-[500] flex flex-col items-center justify-center text-center px-6 welcome-bg">
        <h1 class="text-white text-7xl md:text-9xl font-black italic uppercase tracking-tighter mb-4">HASİR<span class="text-emerald-500">PLAST</span></h1>
        <p class="text-zinc-500 font-bold uppercase tracking-[0.4em] mb-12 text-sm italic">Plastik Hasır ve Kilim</p>
        <button onclick="enterSite()" class="bg-white text-black px-14 py-6 rounded-full font-black uppercase text-xs tracking-[0.2em] hover:bg-emerald-500 hover:text-white transition-all transform active:scale-95 shadow-2xl">Ürünleri Gör <i class="fa-solid fa-arrow-right ml-2"></i></button>
    </section>

    <div class="bg-emerald-600 text-white py-2 text-center text-[10px] font-bold uppercase tracking-[0.3em] fixed top-0 w-full z-[210]">
        Hızlı Teslimat • Toptan Fiyat Avantajı • <span onclick="toggleAdmin()" class="cursor-pointer underline">Yönetici Paneli</span>
    </div>

    <header class="premium-header fixed top-[34px] inset-x-0 z-[200] px-8 py-5">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
                <div class="w-10 h-10 bg-emerald-500 rounded-full flex items-center justify-center shadow-lg"><i class="fa-solid fa-rug text-white"></i></div>
                <span class="font-black italic text-xl tracking-tighter uppercase">HASİR<span class="text-emerald-500">PLAST</span></span>
            </div>

            <div class="flex items-center gap-6">
                <input type="text" id="searchInput" onkeyup="searchProducts()" placeholder="Model ara..." class="py-2 px-4 rounded-full text-[11px] w-48 bg-black/5 outline-none border border-transparent focus:border-emerald-500">
                <button onclick="toggleSepet()" class="relative"><i class="fa-solid fa-bag-shopping text-xl"></i><span id="sepetAdet" class="absolute -top-2 -right-2 bg-emerald-500 text-white text-[9px] w-5 h-5 rounded-full flex items-center justify-center">0</span></button>
                <button onclick="toggleProfile()"><i class="fa-regular fa-user text-xl"></i></button>
            </div>
        </div>
    </header>

    <div id="adminPanel" class="fixed inset-y-0 left-0 w-full md:w-[400px] admin-panel z-[400] p-8 overflow-y-auto border-r border-emerald-500/30">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-black italic text-emerald-500 uppercase">Ürün Yönetimi</h2>
            <button onclick="toggleAdmin()" class="text-2xl">&times;</button>
        </div>
        <div class="space-y-4">
            <div>
                <label class="text-[10px] font-bold uppercase text-zinc-500">Ürün Adı</label>
                <input type="text" id="admName" class="w-full bg-zinc-800 p-3 rounded-xl mt-1 outline-none focus:ring-1 ring-emerald-500">
            </div>
            <div>
                <label class="text-[10px] font-bold uppercase text-zinc-500">Açıklama</label>
                <textarea id="admDesc" class="w-full bg-zinc-800 p-3 rounded-xl mt-1 outline-none h-20"></textarea>
            </div>
            <div>
                <label class="text-[10px] font-bold uppercase text-zinc-500">Birim Fiyat (1 Adet)</label>
                <input type="number" id="admPrice" class="w-full bg-zinc-800 p-3 rounded-xl mt-1 outline-none">
            </div>
            <div>
                <label class="text-[10px] font-bold uppercase text-zinc-500">Görsel URL (veya Dosya Yolu)</label>
                <input type="text" id="admImg" placeholder="img/urun1.jpg" class="w-full bg-zinc-800 p-3 rounded-xl mt-1 outline-none">
            </div>
            <button onclick="urunEkle()" class="w-full bg-emerald-600 p-4 rounded-2xl font-black uppercase text-xs tracking-widest mt-4 hover:bg-emerald-500 transition-all">Ürünü Yayına Al</button>
            
            <div class="mt-10 border-t border-zinc-700 pt-6">
                <h3 class="text-sm font-bold mb-4">Mevcut Ürünleri Sıfırla</h3>
                <button onclick="storageReset()" class="w-full border border-red-500 text-red-500 p-3 rounded-xl text-[10px] font-bold uppercase">Tüm Verileri Temizle</button>
            </div>
        </div>
    </div>

    <div id="profileSidebar" class="fixed inset-y-0 right-0 w-full md:w-[350px] bg-white z-[300] translate-x-full transition-transform duration-500 shadow-2xl p-8 flex flex-col">
        <div class="flex justify-between items-center mb-10 border-b pb-4">
            <h3 class="text-xl font-black italic uppercase tracking-tighter">Müşteri Hesabım</h3>
            <button onclick="toggleProfile()" class="text-3xl text-zinc-300">×</button>
        </div>
        <div id="profileContent" class="space-y-6">
            </div>
    </div>

    <div id="sepetOverlay" onclick="toggleSepet()" class="fixed inset-0 bg-black/40 z-[210] hidden backdrop-blur-sm"></div>
    <div id="sepetSidebar" class="fixed inset-y-0 right-0 w-full md:w-[450px] bg-white z-[220] translate-x-full transition-transform duration-500 flex flex-col shadow-2xl">
        <div class="p-8 border-b flex justify-between items-center bg-white sticky top-0 z-10">
            <h3 class="text-xl font-black italic uppercase tracking-tighter">Sepetim</h3>
            <button onclick="toggleSepet()" class="text-3xl text-zinc-300">×</button>
        </div>
        <div id="sepetListesi" class="flex-1 overflow-y-auto p-8 space-y-6 text-zinc-400 italic text-center">Sepetiniz boş.</div>
        <div class="p-8 bg-zinc-50 border-t">
            <div class="flex justify-between items-end mb-8">
                <span class="text-zinc-400 font-bold uppercase text-[10px] tracking-widest text-left">Bağ Bazlı Toplam<br><small class="normal-case">(Birim x 25)</small></span>
                <span id="sepetToplam" class="text-3xl font-black text-emerald-500 italic">₺0,00</span>
            </div>
            <button onclick="whatsappGonder()" class="w-full bg-emerald-600 text-white py-5 rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg hover:bg-emerald-700 transition-all">Siparişi WhatsApp ile Onayla</button>
        </div>
    </div>

    <main id="mainContent" class="opacity-0 transition-opacity duration-1000 pt-48">
        <section class="pb-24 px-8">
            <div class="container mx-auto">
                <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10">
                    </div>
            </div>
        </section>

        <section class="py-24 border-t border-black/5 px-8">
            <div class="container mx-auto grid md:grid-cols-2 gap-20">
                <div class="space-y-6">
                    <h2 class="text-5xl font-black italic uppercase tracking-tighter">Bize <span class="text-emerald-500">Ulaşın</span></h2>
                    <p class="text-lg font-black italic">İnönü, 359. Sk, 34203 Bağcılar/İstanbul</p>
                    <p class="text-2xl font-black text-emerald-500">0533 658 62 70</p>
                </div>
                <div class="h-80 rounded-[3rem] overflow-hidden grayscale shadow-xl border border-black/5">
                    <iframe src="http://googleusercontent.com/maps.google.com/8" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>
        </section>
    </main>

    <script>
        const WHATSAPP_NO = "905336586270";
        let products = JSON.parse(localStorage.getItem('hp_products')) || [
            {id: Date.now(), name: "Antrasit Hasır", price: 400, desc: "Antibakteriyel plastik örgü.", img: "https://via.placeholder.com/400x500"}
        ];
        let sepet = [];

        function initApp() {
            renderProducts();
            updateMusteriPaneli();
        }

        function enterSite() { 
            document.getElementById('welcomeScreen').classList.add('hidden-screen');
            document.getElementById('mainContent').style.opacity = '1'; 
        }

        // --- YÖNETİCİ FONKSİYONLARI ---
        function toggleAdmin() {
            const p = document.getElementById('adminPanel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        function urunEkle() {
            const name = document.getElementById('admName').value;
            const desc = document.getElementById('admDesc').value;
            const price = document.getElementById('admPrice').value;
            const img = document.getElementById('admImg').value || "https://via.placeholder.com/400x500";

            if(!name || !price) return alert("Ad ve Fiyat zorunludur!");

            const newUrun = { id: Date.now(), name, desc, price: Number(price), img };
            products.push(newUrun);
            localStorage.setItem('hp_products', JSON.stringify(products));
            
            renderProducts();
            alert("Ürün başarıyla eklendi!");
            toggleAdmin();
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(u => `
                <div class="product-card rounded-[2.5rem] overflow-hidden p-6 flex flex-col h-full shadow-sm">
                    <div class="relative aspect-[4/5] rounded-3xl overflow-hidden mb-6 bg-zinc-100">
                        <img src="${u.img}" class="w-full h-full object-cover grayscale">
                        <div class="absolute top-4 left-4 bg-emerald-500 text-white text-[9px] font-black px-3 py-1 rounded-full uppercase">25 Adet (Bağ)</div>
                    </div>
                    <h3 class="font-black text-lg uppercase italic mb-1">${u.name}</h3>
                    <p class="text-zinc-400 text-[10px] italic mb-6 leading-relaxed">${u.desc}</p>
                    <div class="mt-auto flex justify-between items-center pt-4 border-t border-dashed">
                        <div><span class="text-emerald-500 font-black text-xl italic">₺${u.price * 25}</span><p class="text-[8px] text-zinc-400 font-bold uppercase">Bağ Fiyatı</p></div>
                        <button onclick="sepetEkle(${u.id})" class="bg-[#1a1a1a] text-white w-12 h-12 rounded-2xl hover:bg-emerald-500 transition-all active:scale-90 shadow-lg"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>
            `).join('');
        }

        // --- MÜŞTERİ & SEPET FONKSİYONLARI ---
        function sepetEkle(id) {
            const u = products.find(p => p.id === id);
            const index = sepet.findIndex(s => s.id === id);
            if(index > -1) sepet[index].qty++;
            else sepet.push({ ...u, qty: 1 });
            
            updateSepetUI();
            updateMusteriPaneli();
        }

        function updateSepetUI() {
            const list = document.getElementById('sepetListesi');
            let total = 0;
            if(sepet.length === 0) {
                list.innerHTML = "Sepetiniz boş.";
                document.getElementById('sepetToplam').innerText = "₺0,00";
                document.getElementById('sepetAdet').innerText = "0";
                return;
            }

            list.innerHTML = sepet.map((item, idx) => {
                const sub = (item.price * 25) * item.qty;
                total += sub;
                return `
                    <div class="bg-zinc-50 p-5 rounded-[2rem] border border-black/5 flex flex-col gap-3">
                        <div class="flex justify-between items-start">
                            <h4 class="font-black text-[11px] uppercase italic">${item.name}</h4>
                            <button onclick="miktar(${idx}, -100)" class="text-zinc-300 hover:text-red-500">×</button>
                        </div>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3 bg-white rounded-xl p-1 border">
                                <button onclick="miktar(${idx}, -1)" class="w-8 h-8 text-zinc-400">-</button>
                                <span class="text-[10px] font-black">${item.qty} Bağ</span>
                                <button onclick="miktar(${idx}, 1)" class="w-8 h-8 bg-emerald-600 text-white rounded-lg">+</button>
                            </div>
                            <span class="font-black text-sm italic">₺${sub.toLocaleString('tr-TR')}</span>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('sepetToplam').innerText = `₺${total.toLocaleString('tr-TR')}`;
            document.getElementById('sepetAdet').innerText = sepet.reduce((a, b) => a + b.qty, 0);
        }

        function miktar(idx, val) {
            sepet[idx].qty += val;
            if(sepet[idx].qty < 1 || val === -100) sepet.splice(idx, 1);
            updateSepetUI();
            updateMusteriPaneli();
        }

        function updateMusteriPaneli() {
            const content = document.getElementById('profileContent');
            const sepetSayisi = sepet.length;
            content.innerHTML = `
                <div class="p-6 bg-zinc-50 rounded-[2rem] border text-center">
                    <div class="w-16 h-16 bg-emerald-500 rounded-full mx-auto flex items-center justify-center text-white mb-4"><i class="fa-solid fa-user text-xl"></i></div>
                    <p class="font-black text-sm uppercase italic">Hoş Geldin Müşteri</p>
                    <p class="text-[9px] text-zinc-400 mt-1 uppercase font-bold tracking-widest">Bağcılar Bölge Bayi</p>
                </div>
                <div class="space-y-3">
                    <div class="p-4 border rounded-2xl flex justify-between items-center">
                        <span class="text-[10px] font-bold uppercase text-zinc-400">Aktif Sepet Ürünü</span>
                        <span class="font-black text-emerald-500 italic">${sepetSayisi} Çeşit</span>
                    </div>
                    <button class="w-full py-4 text-left px-6 border rounded-2xl text-[10px] font-bold uppercase tracking-widest hover:bg-zinc-50"><i class="fa-solid fa-file-invoice-dollar mr-3"></i> Sipariş Geçmişim</button>
                    <button onclick="storageReset()" class="w-full py-4 text-left px-6 border border-red-100 text-red-500 rounded-2xl text-[10px] font-bold uppercase tracking-widest"><i class="fa-solid fa-trash mr-3"></i> Verilerimi Sıfırla</button>
                </div>
            `;
        }

        function toggleProfile() { 
            const p = document.getElementById('profileSidebar');
            p.style.transform = p.style.transform === 'translateX(0%)' ? 'translateX(100%)' : 'translateX(0%)';
        }

        function toggleSepet() {
            const s = document.getElementById('sepetSidebar');
            const o = document.getElementById('sepetOverlay');
            s.style.transform = s.style.transform === 'translateX(0%)' ? 'translateX(100%)' : 'translateX(0%)';
            o.classList.toggle('hidden');
        }

        function searchProducts() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.product-card').forEach(card => {
                const name = card.querySelector('h3').innerText.toLowerCase();
                card.style.display = name.includes(val) ? 'flex' : 'none';
            });
        }

        function storageReset() {
            if(confirm("Tüm ürünler ve veriler silinecek. Emin misiniz?")) {
                localStorage.clear();
                location.reload();
            }
        }

        function whatsappGonder() {
            if(sepet.length === 0) return alert("Sepetiniz boş!");
            let msg = "*HASİRPLAST SİPARİŞ FORMU*\n------------------\n";
            sepet.forEach(i => {
                msg += `📦 *${i.name}*\nAdet: ${i.qty} Bağ (${i.qty * 25} Adet)\nTutar: ₺${(i.price * 25 * i.qty).toLocaleString('tr-TR')}\n\n`;
            });
            msg += `*TOPLAM:* ${document.getElementById('sepetToplam').innerText}`;
            window.open(`https://api.whatsapp.com/send?phone=${WHATSAPP_NO}&text=${encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
