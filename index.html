<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASİRPLAST | Premium Rugs & Kilims</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Premium Beige Texture & Global Styles */
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f5f2ed; /* Warm Beige */
            background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png"); /* Subtle Paper Texture */
            color: #1a1a1a; 
            scroll-behavior: smooth; 
        }
        
        .admin-gizli { display: none !important; }
        
        /* Modern Header UI */
        .premium-header {
            background: rgba(245, 242, 237, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .nav-link {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #4a4a4a;
            transition: color 0.3s ease;
        }
        .nav-link:hover { color: #10b981; }

        .search-bar {
            background: rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        .search-bar:focus { outline: none; border-color: #10b981; background: #fff; }

        /* Existing Components Styling Integration */
        .product-card { 
            background: #ffffff; 
            border: 1px solid rgba(0,0,0,0.05); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); 
        }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        
        .dark-glass { background: #fff; border-left: 1px solid rgba(0,0,0,0.05); }
        
        @media (max-width: 1024px) { .nav-center { display: none; } }
    </style>
</head>
<body>

    <section id="welcomeScreen" class="fixed inset-0 z-[500] flex flex-col items-center justify-center text-center px-6 bg-[#1a1a1a]">
        <h1 class="text-white text-6xl md:text-8xl font-black italic uppercase tracking-tighter mb-4">HASİR<span class="text-emerald-500">PLAST</span></h1>
        <button onclick="enterSite()" class="bg-white text-black px-12 py-5 rounded-full font-black uppercase text-xs tracking-widest hover:bg-emerald-500 hover:text-white transition-all">Koleksiyonu Keşfet</button>
    </section>

    <header class="premium-header fixed top-0 inset-x-0 z-[200] px-8 py-5">
        <div class="container mx-auto flex justify-between items-center">
            
            <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
                <div class="w-10 h-10 bg-emerald-500 rounded-full flex items-center justify-center rounded-tr-none rounded-bl-none shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-leaf text-white text-xl"></i>
                </div>
                <span class="font-black italic text-xl tracking-tighter text-[#1a1a1a]">HASİR<span class="text-emerald-500">PLAST</span></span>
            </div>

            <nav class="nav-center flex items-center gap-8">
                <a href="#katalog" class="nav-link">Koleksiyon</a>
                <a href="#" class="nav-link">Anadolu Kilimleri</a>
                <a href="#" class="nav-link">Modern Hasırlar</a>
                <a href="#" class="nav-link">Hikayemiz</a>
                <a href="#iletisim" class="nav-link">İletişim</a>
            </nav>

            <div class="flex items-center gap-6">
                <div class="relative hidden md:block">
                    <input type="text" placeholder="Ürün ara..." class="search-bar py-2 px-4 pr-10 rounded-full text-[10px] w-48">
                    <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-zinc-400 text-[10px]"></i>
                </div>
                <button onclick="toggleSepet()" class="relative text-[#1a1a1a] hover:text-emerald-500 transition-colors">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                    <span id="sepetAdet" class="absolute -top-2 -right-2 bg-emerald-500 text-white text-[9px] font-black w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </button>
                <button class="text-[#1a1a1a] hover:text-emerald-500 transition-colors hidden sm:block">
                    <i class="fa-regular fa-user text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <main id="mainContent" class="opacity-0 transition-opacity duration-1000 pt-32">
        
        <section id="katalog" class="pb-20 px-8">
            <div class="container mx-auto">
                <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10"></div>
            </div>
        </section>

        <section id="iletisim" class="py-20 border-t border-black/5 px-8">
            <div class="container mx-auto grid md:grid-cols-2 gap-20">
                <div class="space-y-6">
                    <h2 class="text-3xl font-light italic text-[#1a1a1a]">Bize Ulaşın</h2>
                    <p class="text-zinc-500 text-sm leading-relaxed">Özel ölçü ve toptan siparişleriniz için ekibimiz her zaman yanınızda.</p>
                    <div class="pt-6 space-y-4">
                        <p class="font-bold text-xl">0533 658 62 70</p>
                        <p class="text-zinc-400 uppercase tracking-widest text-[10px]">Bağcılar, İstanbul</p>
                    </div>
                </div>
                <div class="h-80 bg-zinc-200 rounded-3xl overflow-hidden grayscale">
                    <iframe src="http://googleusercontent.com/maps.google.com/2" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>
        </section>
    </main>

    <div id="sepetSidebar" class="fixed inset-y-0 right-0 w-full md:w-[450px] dark-glass z-[300] translate-x-full transition-transform duration-500 shadow-2xl flex flex-col">
        </div>

    <script>
        // Önceki JavaScript mantığının tamamı buraya gelecek (addToCart, updateSepet, Ctrl+P vb.)
        // Sadece tasarım güncellendi, sistem fonksiyonları aynı bırakıldı.
        const NO = "905336586270";
        let sepet = JSON.parse(localStorage.getItem('hasir_sepet_v19')) || [];

        function enterSite() { 
            document.getElementById('welcomeScreen').style.transform = 'translateY(-100%)'; 
            document.getElementById('welcomeScreen').style.transition = 'transform 1.2s cubic-bezier(0.8, 0, 0.2, 1)';
            document.getElementById('mainContent').style.opacity = '1'; 
        }

        // CTRL + P
        document.addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'p') { e.preventDefault(); if(prompt("Sistem Şifresi:") === "nmkhasir") alert("Yönetim Paneli Aktif (Kodda Gizli)"); } });

        // Ürün Oluşturma (Modern Tasarıma Uygun)
        for(let i=1; i<=8; i++) {
            document.getElementById('productGrid').innerHTML += `
                <div class="product-card rounded-[2rem] overflow-hidden p-6">
                    <div class="aspect-[4/5] bg-zinc-100 rounded-[1.5rem] overflow-hidden mb-6 relative">
                        <img id="prodImg${i}" src="antrasit.jpeg" class="w-full h-full object-cover">
                    </div>
                    <h3 id="prodName${i}" class="text-lg font-bold text-[#1a1a1a] mb-2">Hasır Kilim #${i}</h3>
                    <p class="text-zinc-400 text-xs mb-6 uppercase tracking-widest">Premium Collection</p>
                    <div class="flex justify-between items-center">
                        <span class="text-xl font-light italic text-[#1a1a1a]">₺<span id="prodPriceDisplay${i}">400</span></span>
                        <button onclick="addToCart(${i})" class="w-10 h-10 border border-black/5 rounded-full hover:bg-emerald-500 hover:text-white transition-all">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>`;
        }

        function addToCart(i) {
            const name = document.getElementById(`prodName${i}`).innerText;
            const rawPrice = 400; // Örnek fiyat
            sepet.push({ name, price: rawPrice * 25, qty: 1 });
            updateSepet();
            toggleSepet();
        }

        function updateSepet() {
            document.getElementById('sepetAdet').innerText = sepet.length;
            localStorage.setItem('hasir_sepet_v19', JSON.stringify(sepet));
        }

        function toggleSepet() {
            const s = document.getElementById('sepetSidebar');
            s.style.transform = s.style.transform === 'translateX(0%)' ? 'translateX(100%)' : 'translateX(0%)';
        }

        window.onload = () => { updateSepet(); };
    </script>
</body>
</html>
