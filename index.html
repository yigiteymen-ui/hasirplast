<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HasırPlast | Premium Toptan Katalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,700;0,800;1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .admin-gizli, .modal-gizli { display: none !important; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark-glass { background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(15px); border-right: 1px solid rgba(255, 255, 255, 0.1); }
        #sepetSidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover img { transform: scale(1.08); }
        .btn-premium { background: linear-gradient(135deg, #10b981 0%, #059669 100%); transition: all 0.3s ease; }
        .btn-premium:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4); }
        
        /* Özel Kaydırma Çubuğu */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
        #adminPanel::-webkit-scrollbar-thumb { background: #10b981; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900">

    <div id="adminPanel" class="fixed inset-y-0 left-0 w-[340px] dark-glass text-white p-8 z-[200] overflow-y-auto admin-gizli">
        <div class="flex justify-between items-center mb-10">
            <div>
                <h3 class="text-emerald-400 font-extrabold text-xl italic tracking-tighter uppercase">Kontrol Paneli</h3>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">Sistem Versiyon 2.0</p>
            </div>
            <button onclick="togglePanel()" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        
        <div id="productEditorFields" class="space-y-10"></div>

        <div class="mt-12 pt-8 border-t border-white/10">
            <button onclick="localStorage.clear(); location.reload();" class="w-full py-4 rounded-2xl bg-red-500/10 text-red-500 text-[11px] font-black uppercase tracking-widest hover:bg-red-500 hover:text-white transition duration-300 border border-red-500/20">Sistemi Fabrika Ayarlarına Dön</button>
        </div>
    </div>

    <div id="sepetOverlay" onclick="toggleSepet()" class="fixed inset-0 bg-slate-900/40 z-[110] hidden backdrop-blur-md transition-all duration-500"></div>
    <div id="sepetSidebar" class="fixed inset-y-0 right-0 w-full md:w-[420px] bg-white z-[120] shadow-[ -20px_0_50px_rgba(0,0,0,0.1)] translate-x-full flex flex-col">
        <div class="p-8 border-b flex justify-between items-center bg-white">
            <h3 class="font-extrabold italic uppercase tracking-tighter text-2xl text-slate-800">Sipariş Listesi</h3>
            <button onclick="toggleSepet()" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-slate-100 transition text-2xl font-light">×</button>
        </div>
        <div id="sepetListesi" class="flex-1 overflow-y-auto p-6 space-y-6 bg-[#fcfcfd]"></div>
        <div class="p-8 glass m-4 rounded-[2rem] shadow-sm">
            <div class="flex justify-between items-end mb-6">
                <div>
                    <span class="block text-[11px] text-slate-400 font-bold uppercase tracking-[0.2em] mb-1">Ödenecek Tutar</span>
                    <span id="sepetToplam" class="text-4xl font-black text-emerald-600 italic tracking-tighter">₺0,00</span>
                </div>
            </div>
            <button onclick="whatsappSepetGonder()" class="btn-premium w-full text-white py-6 rounded-[1.5rem] font-extrabold uppercase tracking-[0.15em] text-xs shadow-xl active:scale-95">Siparişi Tamamla (WhatsApp)</button>
        </div>
    </div>

    <div id="detayModal" onclick="closeModal(event)" class="fixed inset-0 bg-slate-900/80 z-[300] modal-gizli flex items-center justify-center p-6 backdrop-blur-xl">
        <div class="bg-white w-full max-w-5xl rounded-[3rem] overflow-hidden flex flex-col md:flex-row relative shadow-2xl transition-all duration-500">
            <button onclick="toggleModal()" class="absolute top-6 right-8 text-4xl font-light text-slate-300 hover:text-slate-900 z-10 transition">×</button>
            <div class="md:w-[55%] bg-slate-100 h-[350px] md:h-auto overflow-hidden">
                <img id="modalImg" src="" class="w-full h-full object-cover">
            </div>
            <div class="md:w-[45%] p-10 md:p-16 flex flex-col justify-center">
                <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-emerald-50 text-emerald-600 mb-6 w-fit">
                    <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span></span>
                    <span class="text-[10px] font-black uppercase tracking-widest italic">Stokta Mevcut</span>
                </div>
                <h2 id="modalTitle" class="text-5xl font-extrabold italic uppercase text-slate-900 mb-4 tracking-tighter leading-none"></h2>
                <div class="flex items-baseline gap-3 mb-8">
                    <span id="modalBagPriceDisplay" class="text-3xl font-black text-emerald-600 italic"></span>
                    <span class="text-slate-400 text-xs font-bold uppercase italic tracking-widest">/ Bağ Fiyatı</span>
                </div>
                <p id="modalDesc" class="text-slate-500 mb-12 leading-relaxed text-lg font-medium italic"></p>
                <button id="modalAddBtn" class="btn-premium text-white px-12 py-5 rounded-[1.5rem] font-black uppercase tracking-widest text-xs shadow-2xl active:scale-90">Listeye Ekle</button>
            </div>
        </div>
    </div>

    <nav class="glass sticky top-0 z-[100] px-6 py-5 border-b border-slate-200">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2 group cursor-pointer">
                <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white rotate-12 group-hover:rotate-0 transition-all duration-500 shadow-lg shadow-emerald-200">
                    <i class="fa-solid fa-cube text-xl"></i>
                </div>
                <span class="text-2xl font-black text-slate-900 italic tracking-tighter">HASİRPLAST</span>
            </div>
            <button onclick="toggleSepet()" class="relative group p-4 bg-slate-50 rounded-2xl hover:bg-emerald-50 transition-colors">
                <i class="fa-solid fa-cart-shopping text-slate-700 text-xl group-hover:text-emerald-600 transition"></i>
                <span id="sepetAdet" class="absolute -top-1 -right-1 bg-emerald-600 text-white text-[11px] font-black w-6 h-6 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-200 border-2 border-white">0</span>
            </button>
        </div>
    </nav>

    <header class="pt-24 pb-12 px-6">
        <div class="container mx-auto text-center">
            <span class="text-emerald-600 font-black uppercase tracking-[0.3em] text-[10px] italic mb-4 block">2026 Toptan Koleksiyonu</span>
            <h1 class="text-6xl md:text-8xl font-[900] italic uppercase text-slate-900 tracking-tighter mb-4 leading-none">PROFESYONEL<br><span class="text-transparent" style="-webkit-text-stroke: 1.5px #0f172a;">ÇÖZÜMLER</span></h1>
            <p class="text-slate-400 font-bold uppercase text-xs tracking-[0.2em] italic max-w-lg mx-auto">Tüm ürünlerimizde satışlar 25 adetlik bağlar halindedir.</p>
        </div>
    </header>

    <section class="pb-32 px-6">
        <div class="container mx-auto">
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </div>
    </section>

    <footer class="bg-slate-950 text-white py-24 text-center relative overflow-hidden">
        <div class="container mx-auto px-6 relative z-10">
            <h2 class="text-3xl font-black italic tracking-tighter mb-8">HASİRPLAST</h2>
            <p onclick="panelGiris()" class="text-[11px] uppercase font-bold cursor-pointer text-slate-500 hover:text-emerald-400 tracking-[0.4em] italic transition">Yönetici Girişi • Bağcılar / İstanbul</p>
        </div>
    </footer>

    <script>
        const NO = "905336586270";
        let sepet = JSON.parse(localStorage.getItem('hasir_sepet_v10')) || [];
        const grid = document.getElementById('productGrid');
        const editor = document.getElementById('productEditorFields');

        for(let i=1; i<=8; i++) {
            grid.innerHTML += `
                <div onclick="openProduct(${i})" class="product-card group bg-white rounded-[2.5rem] p-4 shadow-[0_10px_40px_-15px_rgba(0,0,0,0.05)] border border-slate-100 hover:shadow-2xl hover:shadow-emerald-900/5 transition-all duration-500 cursor-pointer">
                    <div class="h-80 overflow-hidden bg-slate-50 rounded-[2rem] relative">
                        <img id="prodImg${i}" src="antrasit.jpeg" class="w-full h-full object-cover transition duration-700">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <div class="absolute bottom-5 left-5 right-5 bg-white/90 backdrop-blur-md p-4 rounded-2xl transform translate-y-4 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all">
                             <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest italic mb-1">Hızlı Görünüm</div>
                             <div class="text-xs font-black uppercase text-slate-900">Detayları İncele</div>
                        </div>
                    </div>
                    <div class="p-6 text-center">
                        <h3 id="prodName${i}" class="font-black text-xl uppercase italic text-slate-800 tracking-tighter mb-3">Ürün ${i}</h3>
                        <div class="flex items-center justify-center gap-2">
                             <span class="text-emerald-600 font-black text-2xl italic tracking-tight">₺<span id="prodPriceDisplay${i}">400,00</span></span>
                        </div>
                    </div>
                </div>`;
            
            editor.innerHTML += `
                <div class="bg-white/5 p-6 rounded-[2rem] border border-white/5 hover:border-emerald-500/30 transition-all group">
                    <div class="flex items-center justify-between mb-6">
                        <span class="text-emerald-400 font-black text-[11px] tracking-widest uppercase italic">Ürün Ayarı #${i}</span>
                        <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
                    </div>
                    
                    <div class="space-y-6">
                        <div class="relative">
                            <label class="text-[9px] text-slate-500 font-black uppercase mb-2 block tracking-widest">Ürün Görseli</label>
                            <input type="file" accept="image/*" onchange="changeImage(event, ${i})" class="w-full text-[10px] file:bg-emerald-600 file:text-white file:border-0 file:rounded-xl file:px-4 file:py-2 file:mr-3 cursor-pointer file:font-black file:uppercase">
                        </div>

                        <div class="relative">
                            <label class="text-[9px] text-slate-500 font-black uppercase mb-2 block tracking-widest">İsimlendirme</label>
                            <input type="text" id="inputName${i}" oninput="update(${i})" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-sm focus:border-emerald-500 transition shadow-inner">
                        </div>

                        <div class="relative">
                            <label class="text-[9px] text-slate-500 font-black uppercase mb-2 block tracking-widest">Birim Bağ Fiyatı</label>
                            <input type="number" id="inputPrice${i}" oninput="update(${i})" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-sm focus:border-emerald-500 transition shadow-inner" placeholder="400">
                        </div>

                        <div class="relative">
                            <label class="text-[9px] text-slate-500 font-black uppercase mb-2 block tracking-widest">Ürün Hikayesi</label>
                            <textarea id="inputDesc${i}" oninput="update(${i})" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-sm h-28 focus:border-emerald-500 transition shadow-inner resize-none"></textarea>
                        </div>
                    </div>
                </div>`;
        }

        function changeImage(e, i) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    document.getElementById(`prodImg${i}`).src = ev.target.result;
                    localStorage.setItem(`img_${i}`, ev.target.result);
                };
                reader.readAsDataURL(file);
            }
        }

        function update(i) {
            let n = document.getElementById(`inputName${i}`).value;
            let p = document.getElementById(`inputPrice${i}`).value;
            let d = document.getElementById(`inputDesc${i}`).value;
            let formatli = parseFloat(p || 0).toFixed(2).replace('.', ',');
            document.getElementById(`prodName${i}`).innerText = n || `Ürün ${i}`;
            document.getElementById(`prodPriceDisplay${i}`).innerText = formatli;
            localStorage.setItem(`n_${i}`, n);
            localStorage.setItem(`p_${i}`, formatli);
            localStorage.setItem(`d_${i}`, d);
        }

        function openProduct(i) {
            const name = document.getElementById(`prodName${i}`).innerText;
            const price = document.getElementById(`prodPriceDisplay${i}`).innerText;
            const img = document.getElementById(`prodImg${i}`).src;
            const desc = localStorage.getItem(`d_${i}`) || "Özel hammadde ile üretilen, UV katkılı ve yüksek dayanımlı profesyonel seri hasır.";
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalBagPriceDisplay').innerText = "₺" + price;
            document.getElementById('modalImg').src = img;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('modalAddBtn').onclick = () => { addToCart(name, price, img); toggleModal(); toggleSepet(); };
            toggleModal();
        }

        function toggleModal() { document.getElementById('detayModal').classList.toggle('modal-gizli'); }
        function closeModal(e) { if(e.target.id === 'detayModal') toggleModal(); }

        function addToCart(name, price, img) {
            const index = sepet.findIndex(item => item.name === name);
            if(index > -1) { sepet[index].qty += 1; } else { sepet.push({ name, price, img, qty: 1 }); }
            updateSepet();
        }

        function miktarButon(index, fark) {
            sepet[index].qty += fark;
            if(sepet[index].qty < 1) { sepet.splice(index, 1); }
            updateSepet();
        }

        function updateSepet() {
            localStorage.setItem('hasir_sepet_v10', JSON.stringify(sepet));
            document.getElementById('sepetAdet').innerText = sepet.reduce((acc, obj) => acc + obj.qty, 0);
            const list = document.getElementById('sepetListesi');
            let total = 0;
            list.innerHTML = "";
            sepet.forEach((item, index) => {
                const ara = parseFloat(item.price.replace(',', '.')) * item.qty * 25;
                total += ara;
                list.innerHTML += `
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm relative group overflow-hidden">
                        <div class="flex gap-5 items-center">
                            <div class="w-20 h-20 bg-slate-50 rounded-2xl overflow-hidden shadow-inner">
                                <img src="${item.img}" class="w-full h-full object-cover">
                            </div>
                            <div class="flex-1">
                                <h4 class="font-black text-sm uppercase italic text-slate-800 tracking-tight">${item.name}</h4>
                                <p class="text-[10px] text-emerald-600 font-black uppercase mt-1 italic tracking-widest">25'li Paket</p>
                            </div>
                            <button onclick="miktarButon(${index}, -999)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-300 hover:text-red-500 transition">×</button>
                        </div>
                        <div class="flex items-center justify-between mt-6 pt-6 border-t border-slate-50">
                            <div class="flex items-center gap-3 bg-slate-50 p-1.5 rounded-2xl border border-slate-100">
                                <button onclick="miktarButon(${index}, -1)" class="w-10 h-10 flex items-center justify-center bg-white rounded-xl shadow-sm font-bold text-lg hover:text-emerald-600 transition">-</button>
                                <span class="font-black text-slate-900 text-sm px-2">${item.qty}</span>
                                <button onclick="miktarButon(${index}, 1)" class="w-10 h-10 flex items-center justify-center bg-slate-900 text-white rounded-xl shadow-lg shadow-slate-200 font-bold text-lg hover:bg-emerald-600 transition">+</button>
                            </div>
                            <div class="text-right">
                                <span class="block text-[9px] text-slate-400 font-bold uppercase tracking-widest italic">Toplam</span>
                                <span class="text-slate-900 font-black text-lg italic tracking-tight">₺${ara.toFixed(2).replace('.', ',')}</span>
                            </div>
                        </div>
                    </div>`;
            });
            document.getElementById('sepetToplam').innerText = `₺${total.toFixed(2).replace('.', ',')}`;
        }

        function toggleSepet() {
            document.getElementById('sepetSidebar').style.transform = document.getElementById('sepetSidebar').style.transform === 'translateX(0%)' ? 'translateX(100%)' : 'translateX(0%)';
            document.getElementById('sepetOverlay').classList.toggle('hidden');
        }

        function whatsappSepetGonder() {
            if(sepet.length === 0) return;
            let msg = "*HASİRPLAST PREMIUM SİPARİŞ*\n\n";
            sepet.forEach(i => msg += `📦 *${i.name}*\n   - Miktar: ${i.qty} Bağ (25'li)\n   - Tutar: ₺${(parseFloat(i.price.replace(',','.'))*i.qty*25).toFixed(2)}\n\n`);
            msg += `💰 *GENEL TOPLAM:* ${document.getElementById('sepetToplam').innerText}`;
            window.open(`https://api.whatsapp.com/send?phone=${NO}&text=${encodeURIComponent(msg)}`);
        }

        function panelGiris() { if(prompt("Sistem Şifresi:") === "nmkhasir") togglePanel(); }
        function togglePanel() { document.getElementById('adminPanel').classList.toggle('admin-gizli'); }

        window.onload = () => {
            updateSepet();
            for(let i=1; i<=8; i++) {
                let n = localStorage.getItem(`n_${i}`) || `Ürün ${i}`;
                let p = localStorage.getItem(`p_${i}`) || "400,00";
                let d = localStorage.getItem(`d_${i}`) || "";
                let img = localStorage.getItem(`img_${i}`) || "antrasit.jpeg";
                document.getElementById(`prodName${i}`).innerText = n;
                document.getElementById(`prodPriceDisplay${i}`).innerText = p;
                document.getElementById(`prodImg${i}`).src = img;
                document.getElementById(`inputName${i}`).value = n;
                document.getElementById(`inputPrice${i}`).value = p.replace(',00', '').replace(',', '.');
                document.getElementById(`inputDesc${i}`).value = d;
            }
        };
    </script>
</body>
</html>
