<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HasırPlast | Profesyonel Toptan Sistemler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-gizli, .modal-gizli { display: none !important; }
        html { scroll-behavior: smooth; }
        .hero-gradient { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)); }
        #sepetSidebar { transition: transform 0.3s ease-in-out; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div id="adminPanel" class="fixed inset-y-0 left-0 w-80 bg-zinc-900 text-white p-6 shadow-2xl z-[150] overflow-y-auto admin-gizli border-r border-emerald-500/30">
        <div class="flex justify-between items-center mb-6 border-b border-zinc-800 pb-4">
            <h3 class="text-xl font-bold text-emerald-400 italic uppercase text-xs tracking-widest">Ürün Yönetimi</h3>
            <button onclick="togglePanel()" class="text-gray-400 hover:text-white text-3xl">×</button>
        </div>
        <div id="productEditorFields" class="space-y-6"></div>
        <button onclick="localStorage.clear(); location.reload();" class="w-full mt-8 bg-red-900/20 text-red-500 text-[10px] font-bold py-3 rounded border border-red-800/30 uppercase tracking-widest">Sıfırla</button>
    </div>

    <div id="sepetOverlay" onclick="toggleSepet()" class="fixed inset-0 bg-black/50 z-[100] hidden backdrop-blur-sm"></div>
    <div id="sepetSidebar" class="fixed inset-y-0 right-0 w-full md:w-96 bg-white z-[110] shadow-2xl translate-x-full flex flex-col">
        <div class="p-6 border-b flex justify-between items-center bg-zinc-900 text-white">
            <h3 class="font-black italic uppercase tracking-tighter text-xl">SİPARİŞ LİSTEM</h3>
            <button onclick="toggleSepet()" class="text-2xl font-light">×</button>
        </div>
        <div id="sepetListesi" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
        <div class="p-6 border-t bg-zinc-50">
            <div class="flex justify-between items-center mb-4">
                <span class="font-bold text-zinc-500 uppercase text-xs tracking-widest">GENEL TOPLAM:</span>
                <span id="sepetToplam" class="text-3xl font-black text-emerald-700 italic">₺0,00</span>
            </div>
            <button onclick="whatsappSepetGonder()" class="w-full bg-emerald-600 text-white py-5 rounded-2xl font-black uppercase tracking-[0.2em] text-xs shadow-lg hover:bg-emerald-500 transition active:scale-95">SİPARİŞİ WHATSAPP'A AKTAR</button>
        </div>
    </div>

    <div id="detayModal" onclick="closeModal(event)" class="fixed inset-0 bg-black/80 z-[200] modal-gizli flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-4xl rounded-[2.5rem] overflow-hidden flex flex-col md:flex-row relative">
            <button onclick="toggleModal()" class="absolute top-4 right-6 text-3xl font-bold text-zinc-400 hover:text-zinc-900 z-10">×</button>
            <div class="md:w-1/2 bg-zinc-100 h-64 md:h-auto">
                <img id="modalImg" src="" class="w-full h-full object-cover">
            </div>
            <div class="md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
                <span class="text-emerald-600 font-bold uppercase tracking-[0.2em] text-[10px] mb-2 italic">Toptan Satış</span>
                <h2 id="modalTitle" class="text-4xl font-black italic uppercase text-zinc-900 mb-2 tracking-tighter"></h2>
                <span id="modalBagPriceDisplay" class="text-2xl font-black text-emerald-700 italic mb-6 block"></span>
                <p id="modalDesc" class="text-zinc-500 mb-8 leading-relaxed italic"></p>
                <div class="flex justify-between items-center border-t border-zinc-100 pt-8">
                    <span class="text-zinc-400 font-bold uppercase text-[10px] tracking-widest">Minimum 1 Bağ (25 Adet)</span>
                    <button id="modalAddBtn" class="bg-zinc-900 text-white px-10 py-4 rounded-2xl font-black uppercase tracking-widest text-xs hover:bg-emerald-600 transition shadow-xl active:scale-90">Sepete Ekle</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="bg-white/90 backdrop-blur-md shadow-md sticky top-0 z-40 p-5 border-b">
        <div class="container mx-auto flex justify-between items-center">
            <a href="#" class="text-2xl font-black text-emerald-700 italic tracking-tighter">HASİRPLAST</a>
            <button onclick="toggleSepet()" class="relative group p-2">
                <i class="fa-solid fa-cart-shopping text-zinc-800 text-2xl group-hover:text-emerald-600 transition"></i>
                <span id="sepetAdet" class="absolute top-0 right-0 bg-emerald-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
            </button>
        </div>
    </nav>

    <section id="katalog" class="py-24 px-4 bg-white">
        <div class="container mx-auto">
            <div class="mb-16 border-l-8 border-emerald-600 pl-6">
                <h2 class="text-5xl md:text-6xl font-black italic uppercase text-zinc-900 tracking-tighter">KOLEKSİYON</h2>
                <p class="text-zinc-400 italic mt-2 font-bold uppercase text-[10px] tracking-widest">SATIŞLAR 25 ADETLİK BAĞLAR HALİNDEDİR.</p>
            </div>
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10"></div>
        </div>
    </section>

    <footer class="bg-zinc-900 text-white py-14 text-center">
        <p onclick="panelGiris()" class="text-[11px] uppercase font-bold cursor-pointer opacity-30 hover:opacity-100 tracking-widest italic">© 2026 HASİRPLAST - BAĞCILAR</p>
    </footer>

    <script>
        const NO = "905336586270";
        let sepet = JSON.parse(localStorage.getItem('hasir_sepet_v7')) || [];

        const grid = document.getElementById('productGrid');
        const editor = document.getElementById('productEditorFields');

        for(let i=1; i<=8; i++) {
            grid.innerHTML += `
                <div onclick="openProduct(${i})" class="bg-white rounded-[2.5rem] shadow-xl border border-gray-100 overflow-hidden flex flex-col hover:-translate-y-3 transition duration-500 cursor-pointer group">
                    <div class="h-80 overflow-hidden bg-zinc-200 relative">
                        <img id="prodImg${i}" src="antrasit.jpeg" class="w-full h-full object-cover transition duration-700 group-hover:scale-110">
                        <div class="absolute bottom-6 left-6 bg-emerald-600 text-white text-[10px] font-black px-4 py-1.5 rounded-full uppercase italic tracking-tighter shadow-lg">25 ADET (1 BAĞ)</div>
                    </div>
                    <div class="p-8 flex flex-col items-center text-center">
                        <h3 id="prodName${i}" class="font-black text-lg uppercase italic text-zinc-800 tracking-tighter mb-2">Ürün ${i}</h3>
                        <span class="text-emerald-700 font-black text-2xl italic">₺<span id="prodPriceDisplay${i}">400,00</span></span>
                        <div class="mt-4 text-[10px] text-zinc-300 font-bold uppercase tracking-tighter italic">DETAYLAR İÇİN TIKLAYIN</div>
                    </div>
                </div>`;
            
            editor.innerHTML += `
                <div class="bg-zinc-800 p-5 rounded-2xl border border-zinc-700 space-y-4">
                    <span class="text-emerald-400 font-black text-[11px] uppercase italic">Ürün #${i}</span>
                    <input type="number" id="inputPrice${i}" oninput="update(${i})" class="w-full bg-zinc-700 p-3 rounded-xl outline-none text-sm" placeholder="Görünecek Fiyat (Örn: 400)">
                    <p class="text-[10px] text-zinc-500 italic">Sepette bu fiyat 25 ile çarpılacaktır.</p>
                </div>`;
        }

        function openProduct(i) {
            const name = document.getElementById(`prodName${i}`).innerText;
            const price = document.getElementById(`prodPriceDisplay${i}`).innerText;
            const img = document.getElementById(`prodImg${i}`).src;
            
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalBagPriceDisplay').innerText = "₺" + price;
            document.getElementById('modalImg').src = img;
            
            document.getElementById('modalAddBtn').onclick = () => {
                addToCart(name, price, img);
                toggleModal();
                toggleSepet();
            };
            toggleModal();
        }

        function toggleModal() { document.getElementById('detayModal').classList.toggle('modal-gizli'); }
        function closeModal(e) { if(e.target.id === 'detayModal') toggleModal(); }

        function addToCart(name, price, img) {
            const index = sepet.findIndex(item => item.name === name);
            if(index > -1) {
                sepet[index].qty += 1;
            } else {
                sepet.push({ name, price, img, qty: 1 });
            }
            updateSepet();
        }

        function miktarButon(index, fark) {
            sepet[index].qty += fark;
            if(sepet[index].qty < 1) { sepet.splice(index, 1); }
            updateSepet();
        }

        function updateSepet() {
            localStorage.setItem('hasir_sepet_v7', JSON.stringify(sepet));
            document.getElementById('sepetAdet').innerText = sepet.reduce((acc, obj) => acc + obj.qty, 0);
            
            const list = document.getElementById('sepetListesi');
            let total = 0;
            list.innerHTML = "";

            sepet.forEach((item, index) => {
                // HESAPLAMA: Görünür Fiyat x Miktar x 25
                const displayPrice = parseFloat(item.price.replace(',', '.'));
                const araToplam = displayPrice * item.qty * 25; 
                total += araToplam;

                list.innerHTML += `
                    <div class="bg-zinc-50 p-5 rounded-[2rem] border border-zinc-100">
                        <div class="flex gap-4 items-center mb-4">
                            <img src="${item.img}" class="w-16 h-16 object-cover rounded-2xl">
                            <div class="flex-1">
                                <h4 class="font-black text-sm uppercase italic text-zinc-800 tracking-tighter">${item.name}</h4>
                                <p class="text-[9px] text-zinc-400 font-bold uppercase mt-1 italic">25 ADET HASIR</p>
                            </div>
                        </div>
                        <div class="flex items-center justify-between bg-white p-2 rounded-2xl border border-zinc-200">
                            <span class="text-[9px] font-black uppercase text-zinc-500 pl-3">BAĞ:</span>
                            <div class="flex items-center gap-3">
                                <button onclick="miktarButon(${index}, -1)" class="w-8 h-8 flex items-center justify-center bg-zinc-100 rounded-xl hover:bg-zinc-200 transition font-bold">-</button>
                                <span class="font-black text-zinc-800 text-sm">${item.qty}</span>
                                <button onclick="miktarButon(${index}, 1)" class="w-8 h-8 flex items-center justify-center bg-zinc-900 text-white rounded-xl hover:bg-emerald-600 transition font-bold">+</button>
                            </div>
                        </div>
                        <div class="text-right mt-3">
                             <span class="text-[10px] text-zinc-400 font-bold uppercase italic">ARA TOPLAM:</span>
                             <span class="text-emerald-700 font-black text-sm ml-2">₺${araToplam.toFixed(2).replace('.', ',')}</span>
                        </div>
                    </div>`;
            });
            document.getElementById('sepetToplam').innerText = `₺${total.toFixed(2).replace('.', ',')}`;
        }

        function toggleSepet() {
            const side = document.getElementById('sepetSidebar');
            const over = document.getElementById('sepetOverlay');
            const isOpen = side.style.transform === 'translateX(0%)';
            side.style.transform = isOpen ? 'translateX(100%)' : 'translateX(0%)';
            over.classList.toggle('hidden');
        }

        function whatsappSepetGonder() {
            if(sepet.length === 0) return alert("Listeniz boş!");
            let msg = "*HASİRPLAST TOPTAN SİPARİŞ*\n--------------------------\n";
            sepet.forEach((item) => {
                const ara = (parseFloat(item.price.replace(',','.')) * item.qty * 25).toFixed(2);
                msg += `📦 *${item.name}*\n   - Miktar: ${item.qty} Bağ (25 Adet)\n   - Toplam: ₺${ara}\n\n`;
            });
            msg += `--------------------------\n💰 *GENEL TOPLAM:* ${document.getElementById('sepetToplam').innerText}\n\n*Bağcılar Şubesi*`;
            window.open(`https://api.whatsapp.com/send?phone=${NO}&text=${encodeURIComponent(msg)}`, '_blank');
        }

        function update(i) {
            let p = document.getElementById(`inputPrice${i}`).value;
            let formatli = parseFloat(p || 0).toFixed(2).replace('.', ',');
            document.getElementById(`prodPriceDisplay${i}`).innerText = formatli;
            localStorage.setItem(`p_${i}`, formatli);
        }

        function panelGiris() { if(prompt("Şifre:") === "nmkhasir") document.getElementById('adminPanel').classList.toggle('admin-gizli'); }

        window.onload = () => {
            updateSepet();
            for(let i=1; i<=8; i++) {
                let p = localStorage.getItem(`p_${i}`) || "400,00";
                document.getElementById(`prodPriceDisplay${i}`).innerText = p;
                document.getElementById(`inputPrice${i}`).value = p.replace(',00', '').replace(',', '.');
            }
        };
    </script>
</body>
</html>
